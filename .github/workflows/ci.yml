name: app-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos   # warnings and errors fail the build, style hints do not
      - run: flutter test

  android-build:
    # Runs once the android/ folder (from `flutter create .`) is committed.
    runs-on: ubuntu-latest
    needs: analyze-test
    if: ${{ hashFiles('android/app/build.gradle*') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
