name: glo_eams_mobile
description: GLO EAMS - Globacom employee attendance (GPS geofence, face check, offline-first sync).
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  geolocator: ^13.0.2
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  path_provider: ^2.1.6
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  uuid: ^4.5.1
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_commons: ^0.8.0
  safe_device: ^1.1.6
  share_plus: ^12.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/glo_logo.png
    - assets/certs/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/glo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/glo_icon_fg.png"
  remove_alpha_ios: true
